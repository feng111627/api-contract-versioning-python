[pytest]
testpaths = tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S
addopts = -v
markers =
    scenario(name): 该测试类覆盖的业务场景名称
filterwarnings =
    # 兼容期内服务端主动读取废弃字段属于预期行为，忽略 Pydantic 的废弃访问告警
    ignore:deprecated:DeprecationWarning
